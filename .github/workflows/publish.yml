name: Publish

# Publishing is tag-driven: pushing v0.1.0 builds the distribution and uploads it
# to PyPI. Uses PyPI trusted publishing (OIDC) — no API token in the repository.
#
# One-time setup on PyPI: your project → Publishing → add a trusted publisher
#   owner: TENET-DEV-AI  repository: TENET-AI  workflow: publish.yml  environment: pypi
#
# Remember to bump `version` in pyproject.toml before tagging.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build backend
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Check the metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

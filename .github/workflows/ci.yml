name: CI
permissions:
  contents: read

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v7.0.1
    
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        
    - name: Run unit tests
      run: |
        pytest tests/unit/ -v
        
    - name: Run training script check
      run: |
        python scripts/train_model.py --test-only
        
    - name: Run integration tests
      env:
        REDIS_HOST: localhost
        REDIS_PORT: 6379
      run: |
        # Only run if services can be mocked or local redis is enough
        # Current test_e2e requires full services, so might fail without them
        # pytest tests/integration/test_e2e.py -v
        echo "Skipping E2E in CI for now - requires analyzer/ingest containers"

  e2e-tests:
    name: Frontend E2E Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root and app dependencies
        run: |
          npm ci
          npm --prefix dashboard ci
          npm --prefix landing ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests
        run: npx playwright test tests/e2e/landing.spec.ts tests/e2e/dashboard-auth.spec.ts tests/e2e/dashboard-alerts.spec.ts tests/e2e/dashboard-filters.spec.ts

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

name: CI
permissions:
  contents: read

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v7.0.1
    
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        
    - name: Run unit tests
      run: |
        pytest tests/unit/ -v
        
    - name: Run training script check
      run: |
        python scripts/train_model.py --test-only
        

  integration:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'
        cache: 'pip'

    - name: Install dependencies
      run: python -m pip install -r requirements-dev.txt

    - name: Start ingest and analyzer
      env:
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        API_KEY: tenet-ci-integration-key
        MODEL_PATH: ./models/trained
      run: |
        python -m uvicorn services.ingest.app:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/ingest.log" 2>&1 &
        python -m uvicorn services.analyzer.app:app --host 127.0.0.1 --port 8100 > "$RUNNER_TEMP/analyzer.log" 2>&1 &
        python - <<'PY'
        import json
        import time
        from urllib.error import URLError
        from urllib.request import urlopen

        for service, port in (("ingest", 8000), ("analyzer", 8100)):
            for _ in range(30):
                try:
                    with urlopen(f"http://127.0.0.1:{port}/health", timeout=2) as response:
                        health = json.load(response)
                    if health.get("service") == service and health.get("redis_connected"):
                        break
                except (URLError, TimeoutError, ValueError):
                    pass
                time.sleep(1)
            else:
                raise SystemExit(f"{service} failed to become healthy with Redis")
        PY

    - name: Run integration tests
      env:
        INGEST_URL: http://127.0.0.1:8000
        ANALYZER_URL: http://127.0.0.1:8100
        API_KEY: tenet-ci-integration-key
      run: pytest tests/integration/ -v -ra

    - name: Show service logs on failure
      if: failure()
      run: |
        cat "$RUNNER_TEMP/ingest.log" 2>/dev/null || true
        cat "$RUNNER_TEMP/analyzer.log" 2>/dev/null || true

  e2e-tests:
    name: Frontend E2E Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install root and app dependencies
        run: |
          npm ci
          npm --prefix dashboard ci
          npm --prefix landing ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests
        run: npx playwright test tests/e2e/landing.spec.ts tests/e2e/dashboard-auth.spec.ts tests/e2e/dashboard-alerts.spec.ts tests/e2e/dashboard-filters.spec.ts

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

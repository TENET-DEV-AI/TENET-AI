# Automated Release Pipeline (Issue #106)
# Triggered when a version tag is pushed (e.g. v1.2.3)

name: Automated Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Generate Changelog & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Check the tag matches pyproject
        # Without this, pushing v1.2.3 happily publishes whatever version
        # pyproject.toml happens to say — and `skip-existing` hides the mismatch.
        run: |
          python3 - <<'PY'
          import os, pathlib, re, sys, tomllib

          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          # Drop a pre-release suffix: v0.2.0-rc1 ships 0.2.0 to the index.
          tag_version = re.split(r"[-+]", tag)[0]

          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]
          declared = project["version"]

          if declared != tag_version:
              sys.exit(
                  f"Tag {os.environ['GITHUB_REF_NAME']} does not match pyproject version "
                  f"{declared}. Bump `[project] version` before tagging."
              )
          print(f"Tag {os.environ['GITHUB_REF_NAME']} matches pyproject version {declared}")
          PY

      - name: Generate changelog with git-cliff
        uses: orhun/git-cliff-action@v4
        id: changelog
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.changelog.outputs.content }}
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build Python package
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        if: "!contains(github.ref, '-rc') && !contains(github.ref, '-beta') && !contains(github.ref, '-alpha')"
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker tags
        id: docker-tags
        env:
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          TAGS="ghcr.io/${REPOSITORY}:${TAG_NAME}"
          if [[ ! "${TAG_NAME}" =~ -(rc|beta|alpha) ]]; then
            TAGS="${TAGS},ghcr.io/${REPOSITORY}:latest"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.docker-tags.outputs.tags }}